name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run vanilla Python tool tests
        run: python -m unittest discover -s tests -v
